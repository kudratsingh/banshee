# Dedicated Ubuntu 24.04 VM for PX4 SITL (WO-002). Own disk and processes, no shared daemon
# (AGENTS.md 1.3). Remove it with: limactl delete banshee-sitl
vmType: vz
arch: aarch64
cpus: 8
memory: 12GiB
disk: 30GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e
# The only mount is this repository, read-only, set by start_vm.sh. The default mount of the home
# directory is deliberately replaced, so the VM cannot see other projects (AGENTS.md 1.1).
mounts: []
containerd:
  system: false
  user: false
